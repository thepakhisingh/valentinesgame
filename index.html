<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    width:100vw;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    position:relative;
}

/* Center text container */
.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    width:90%;
    pointer-events:none;
}

h1{
    font-size:2.4rem;
    margin-bottom:25px;
}

/* Buttons */
.btn{
    padding:15px 40px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:#ff4d6d;
    color:white;
    box-shadow:0 0 20px rgba(255,77,109,0.8);
    transition:transform 0.3s ease;
    pointer-events:auto;
}

/* Initial button placement */
#yesBtn, #noBtn{
    position:absolute;
}

/* Floating hearts */
.heart{
    position:absolute;
    font-size:18px;
    opacity:0.7;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{transform:translateY(100vh);}
    to{transform:translateY(-120vh);}
}
</style>
</head>

<body>

<!-- Screen 1 -->
<div class="container" id="screen1">
    <h1>I want to ask you something…</h1>
    <button class="btn" onclick="next()">Continue 💌</button>
</div>

<!-- Screen 2 -->
<div class="container" id="screen2" style="display:none;">
    <h1 id="question">Will you be my Valentine? 🌸</h1>
</div>

<!-- Buttons on screen -->
<button class="btn" id="yesBtn" style="display:none;" onclick="yes()">YES 💗</button>
<button class="btn" id="noBtn" style="display:none;" onclick="no()">NO 🙈</button>

<!-- Screen 3 -->
<div class="container" id="screen3" style="display:none;">
    <h1>Yay 💖 You made my day!</h1>
    <h2>I knew you'll say yes!!</h2>
</div>

<script>
let noCount = 0;

const messages = [
    "Really? 🥺 Please reconsider…",
    "Are you absolutely sure? 💔",
    "Come on… give us a chance? 💗",
    "Still asking 😳 I’ll wait…"
];

// Start floating hearts
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💗";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*3+4)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),7000);
},500);

function next(){
    screen1.style.display="none";
    screen2.style.display="block";

    yesBtn.style.display="block";
    noBtn.style.display="block";

    placeButtonsCenter();
}

function placeButtonsCenter(){
    const centerY = window.innerHeight/2 + 60;

    yesBtn.style.left = (window.innerWidth/2 - 130) + "px";
    yesBtn.style.top  = centerY + "px";

    noBtn.style.left  = (window.innerWidth/2 + 10) + "px";
    noBtn.style.top   = centerY + "px";
}

function no(){
    question.innerText = messages[noCount % messages.length];
    noCount++;

    moveAndResize(noBtn);
    moveAndResize(yesBtn);
}

function moveAndResize(btn){
    const minScale = 0.9;
    const maxScale = 1.15;
    const scale = Math.random() * (maxScale - minScale) + minScale;

    btn.style.transform = `scale(${scale})`;

    const btnWidth = btn.offsetWidth * scale;
    const btnHeight = btn.offsetHeight * scale;

    const padding = 30;

    const maxX = window.innerWidth - btnWidth - padding;
    const maxY = window.innerHeight - btnHeight - padding;

    const x = Math.random() * maxX + padding;
    const y = Math.random() * maxY + padding;

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

function yes(){
    screen2.style.display="none";
    yesBtn.style.display="none";
    noBtn.style.display="none";

    screen3.style.display="block";
}
</script>

</body>
</html>
